[Basic]
OpenDebug = false

[mysql]
# MySQL address, e.g. 127.0.0.1:3306
Addr = {{MYSQL_ADDR}}

# dedicated minimal-privilege account (INSERT/UPDATE on target table only)
User = {{MYSQL_USER}}
Password = {{MYSQL_PASSWORD}}

# target database and table (table created by ai-gateway-api repo DDL, see db_ddl_report_mysql.sql)
DBName = {{MYSQL_DB}}
Table = bfe_ai_request_log

# small timeout/interval to keep the retry loop observable within test time
ConnectTimeoutMs = 2000
ConnectRetryIntervalMs = 200

[Writer]
# record buffer queue size (records)
QueueSize = 2000

# batch size (records)
BatchSize = 5

# batch flush interval in milliseconds
FlushIntervalMs = 200

# max retries on write failure (backoff 200ms/400ms/800ms)
# (after exhaustion the batch is held and rewritten once reconnect succeeds)
MaxRetries = 3

# single batch transaction timeout in milliseconds (ExecContext deadline and
# driver writeTimeout); bounds each attempt during a network partition
BatchTimeoutMs = 2000

# connection pool
MaxOpenConns = 10
MaxIdleConns = 5
